[pytest]
# Keep test collection inside tests/. The repository root contains local-only
# artifacts (logs/, results/, data/, .venv, tool caches and a stray
# pytest-of-lkl/ directory) that must never be collected.
testpaths = tests
norecursedirs = .git .venv __pycache__ .mypy_cache .ruff_cache .pytest_cache logs results data neo4j pytest-of-lkl torchinductor_lkl
addopts = -ra
