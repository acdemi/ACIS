name: capability_sweep
description: Run each capability suite to exercise every cognitive dimension.
dataset: benchmarks/datasets/planning.json
output_root: results/experiments
runs:
- name: suite_planning
  dataset: benchmarks/datasets/planning.json
  planner: true
  debate: true
  memory: true
  tool_router: true
  counterfactual: true
  critic: true
  seed: 7
  max_cases: 4
  save_traces: false
  rules_only: false
- name: suite_memory
  dataset: benchmarks/datasets/memory.json
  planner: true
  debate: true
  memory: true
  tool_router: true
  counterfactual: true
  critic: true
  seed: 7
  max_cases: 4
  save_traces: false
  rules_only: false
- name: suite_debate
  dataset: benchmarks/datasets/debate.json
  planner: true
  debate: true
  memory: true
  tool_router: true
  counterfactual: true
  critic: true
  seed: 7
  max_cases: 4
  save_traces: false
  rules_only: false
- name: suite_counterfactual
  dataset: benchmarks/datasets/counterfactual.json
  planner: true
  debate: true
  memory: true
  tool_router: true
  counterfactual: true
  critic: true
  seed: 7
  max_cases: 3
  save_traces: false
  rules_only: false
- name: suite_adversarial
  dataset: benchmarks/datasets/adversarial.json
  planner: true
  debate: true
  memory: true
  tool_router: true
  counterfactual: true
  critic: true
  seed: 7
  max_cases: 3
  save_traces: false
  rules_only: false
ablation:
  enabled: false
  combos: []
  dataset: null
  seed: 7
  max_cases: null
  rules_only: false
capability_eval: true
metadata:
  author: ACIS
  version: '1.0'
  tags:
  - capability
  - sweep
  notes: ''
  paper: ''
