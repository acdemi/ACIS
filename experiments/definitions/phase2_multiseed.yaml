name: phase2_multiseed
description: "Phase 2 — Real-LLM Multi-Seed Stability & Calibration Study"
dataset: benchmarks.datasets.enriched
capability_eval: true
save_traces: true
use_llm_judge: true
metadata:
  author: ACIS Research
  paper: ACIS 2.1E Phase 2 Multi-Seed
  tags: [phase2, multiseed, stability, calibration]

runs:
  - name: all_on
    planner: true
    debate: true
    memory: true
    tool_router: true
    counterfactual: true
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_memory
    planner: true
    debate: true
    memory: false
    tool_router: true
    counterfactual: true
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_debate
    planner: true
    debate: false
    memory: true
    tool_router: true
    counterfactual: true
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_counterfactual
    planner: true
    debate: true
    memory: true
    tool_router: true
    counterfactual: false
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_planner
    planner: false
    debate: true
    memory: true
    tool_router: true
    counterfactual: true
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_tool_router
    planner: true
    debate: true
    memory: true
    tool_router: false
    counterfactual: true
    critic: true
    seeds: [42, 123, 456, 789, 1024]

  - name: no_critic
    planner: true
    debate: true
    memory: true
    tool_router: true
    counterfactual: true
    critic: false
    seeds: [42, 123, 456, 789, 1024]

max_cases: null