services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-acis-api:latest
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: /app
      # Optional: pass your DeepSeek key via the host env (start.ps1 / start.sh
      # does this for you), e.g. $env:DEEPSEEK_API_KEY='sk-...'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agriai2026
      AGRI_AI_KG_BACKEND: auto
      AGRI_AI_RAG_BACKEND: auto
      QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j:community
    container_name: agri-neo4j
    restart: unless-stopped
    ports:
      - "17474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/agriai2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - apoc.export.file.enabled=true
      - apoc.import.file.enabled=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  qdrant_storage:
  neo4j_data:
