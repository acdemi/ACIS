services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-acis-api:1.0.0
    restart: unless-stopped
    working_dir: /app
    volumes:
      - type: bind
        source: ${ACIS_API_DATA_DIR:-./data}
        target: /app/data
    ports:
      - "127.0.0.1:${ACIS_API_PORT:-8000}:8000"
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: /app
      ACIS_API_KEY: ${ACIS_API_KEY:?Set ACIS_API_KEY in the environment or .env}
      # Optional: pass your DeepSeek key via the host env (start.ps1 / start.sh
      # does this for you), e.g. $env:DEEPSEEK_API_KEY='sk-...'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the environment or .env}
      AGRI_AI_KG_BACKEND: auto
      AGRI_AI_RAG_BACKEND: auto
      QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACIS_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$$status\" == *200* ]]"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  neo4j:
    image: neo4j:2026.05.0-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACIS_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${ACIS_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the environment or .env}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  qdrant_storage:
  neo4j_data:
