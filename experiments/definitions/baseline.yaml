name: baseline_all_on
description: All cognitive modules enabled on the enriched dataset (Sprint 05 baseline).
dataset: benchmarks.datasets.enriched
output_root: results/experiments
capability_eval: true
metadata:
  author: ACIS
  version: "1.0"
  tags: [baseline, enriched]
  notes: Full pipeline baseline; set max_cases to null for a complete run.
  paper: ""
runs:
  - name: all_on
    planner: true
    debate: true
    memory: true
    tool_router: true
    counterfactual: true
    critic: true
    seed: 7
    max_cases: 6
    save_traces: false
    rules_only: false